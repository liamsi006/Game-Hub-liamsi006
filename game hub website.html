<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0, minimum-scale=1.0">
  <title>GameHub • 5-in-1 Arcade</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #1a1e2b 0%, #282e3f 100%);
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      margin: 0;
    }

    .game-container {
      max-width: 750px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: linear-gradient(135deg, rgba(40, 45, 60, 0.9) 0%, rgba(20, 22, 30, 0.95) 100%);
      border-radius: 3rem;
      padding: 2rem 2rem 2.2rem;
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s ease;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #f8e3a0, #f5b56b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.5rem;
      text-shadow: 0 8px 18px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .game-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.65rem;
      margin-bottom: 2rem;
      background: rgba(0, 0, 0, 0.35);
      padding: 0.6rem 0.8rem;
      border-radius: 4rem;
      backdrop-filter: blur(12px);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #ccd6e0;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.7rem 1.4rem;
      border-radius: 3rem;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(4px);
      white-space: nowrap;
    }

    .tab-btn i {
      margin-right: 0.3rem;
      font-style: normal;
    }

    .tab-btn.active {
      background: #f7b05e;
      color: #0b0c10;
      box-shadow: 0 8px 20px rgba(247, 176, 94, 0.45);
      font-weight: 700;
      transform: scale(1.02);
    }

    .game-window {
      width: 100%;
      background: #0f1117;
      border-radius: 2rem;
      padding: 1.8rem 1.5rem 1.8rem;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.7), 0 18px 30px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 400px;
    }

    .game-panel {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .game-panel.active-game {
      display: flex;
    }

    .canvas-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1b1e28;
      border-radius: 1.5rem;
      padding: 0.5rem;
      margin-bottom: 1.4rem;
      box-shadow: inset 0 0 12px #00000050;
    }

    canvas {
      background: #202433;
      border-radius: 1.2rem;
      display: block;
      max-width: 100%;
      height: auto;
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: 1rem 0 0.5rem;
    }

    button {
      background: #2f3545;
      border: none;
      color: #f0f3fa;
      font-weight: 600;
      padding: 0.7rem 1.5rem;
      border-radius: 2.5rem;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.25s, transform 0.1s, box-shadow 0.2s;
      background: linear-gradient(180deg, #3a4055 0%, #252b38 100%);
      box-shadow: 0 6px 14px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.1);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    button:hover {
      background: linear-gradient(180deg, #4b5269 0%, #2f3545 100%);
      box-shadow: 0 8px 18px rgba(0,0,0,0.6);
      color: white;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.7);
    }

    .score-board {
      font-size: 1.5rem;
      font-weight: 700;
      background: #0b0d14;
      padding: 0.4rem 2rem;
      border-radius: 3rem;
      color: #fadf9e;
      margin: 0.5rem 0;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .instruction {
      color: #b9c2d4;
      font-size: 0.9rem;
      margin: 0.4rem 0 0.2rem;
    }

    hr {
      width: 80%;
      border: 0.5px solid rgba(255,255,255,0.15);
      margin: 0.8rem 0;
    }

    @media (max-width: 500px) {
      .game-container {
        padding: 1.5rem 1rem;
      }
      .tab-btn {
        padding: 0.5rem 1rem;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
<div class="game-container">
  <h1>
    <span>🎮</span> GAMEHUB <span>🕹️</span>
  </h1>

  <!-- Tab navigation -->
  <div class="game-tabs">
    <button class="tab-btn active" data-game="snake"><i>🐍</i> Snake</button>
    <button class="tab-btn" data-game="tictactoe"><i>❌⭕</i> Tic Tac Toe</button>
    <button class="tab-btn" data-game="pong"><i>🏓</i> Pong</button>
    <button class="tab-btn" data-game="memory"><i>🧠</i> Memory</button>
    <button class="tab-btn" data-game="clicker"><i>👆</i> Clicker</button>
  </div>

  <!-- Dynamic game panels -->
  <div class="game-window" id="gameWindow">
    <!-- Snake Panel -->
    <div class="game-panel active-game" id="panel-snake">
      <div class="canvas-wrapper">
        <canvas id="snakeCanvas" width="320" height="320"></canvas>
      </div>
      <div class="score-board">🍎 <span id="snakeScoreDisplay">0</span></div>
      <div class="controls">
        <button id="snakeRestartBtn">↺ New Game</button>
      </div>
      <div class="instruction">⬆️⬇️⬅️➡️ Arrow keys to move</div>
    </div>

    <!-- Tic Tac Toe Panel -->
    <div class="game-panel" id="panel-tictactoe">
      <div class="canvas-wrapper">
        <canvas id="tictactoeCanvas" width="300" height="300"></canvas>
      </div>
      <div class="score-board" id="tttStatus">❌ Turn: X</div>
      <div class="controls">
        <button id="tttRestartBtn">🔄 New Game</button>
      </div>
      <div class="instruction">Click on grid to place mark</div>
    </div>

    <!-- Pong Panel -->
    <div class="game-panel" id="panel-pong">
      <div class="canvas-wrapper">
        <canvas id="pongCanvas" width="400" height="250"></canvas>
      </div>
      <div class="score-board">🏆 <span id="pongScoreDisplay">0 : 0</span></div>
      <div class="controls">
        <button id="pongRestartBtn">🔄 Restart</button>
      </div>
      <div class="instruction">⬆️⬇️ Arrow keys (right paddle) | W/S (left paddle)</div>
    </div>

    <!-- Memory Panel -->
    <div class="game-panel" id="panel-memory">
      <div class="canvas-wrapper">
        <canvas id="memoryCanvas" width="320" height="280"></canvas>
      </div>
      <div class="score-board">⭐ Moves: <span id="memoryMoves">0</span></div>
      <div class="controls">
        <button id="memoryRestartBtn">🔄 New Game</button>
      </div>
      <div class="instruction">Click tiles to find matching pairs</div>
    </div>

    <!-- Clicker Panel -->
    <div class="game-panel" id="panel-clicker">
      <div style="margin:1rem 0; font-size:2rem;">🎯</div>
      <div class="score-board">✨ Clicks: <span id="clickerCount">0</span></div>
      <div class="controls">
        <button id="clickerBtn" style="font-size:1.4rem; padding:0.8rem 2.2rem;">👆 CLICK ME!</button>
      </div>
      <div class="controls" style="margin-top:0.3rem;">
        <button id="clickerResetBtn">↺ Reset</button>
      </div>
      <div class="instruction">Click the big button as fast as you can!</div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- GAME STATE MANAGEMENT ----------
    const panels = {
      snake: document.getElementById('panel-snake'),
      tictactoe: document.getElementById('panel-tictactoe'),
      pong: document.getElementById('panel-pong'),
      memory: document.getElementById('panel-memory'),
      clicker: document.getElementById('panel-clicker')
    };

    const tabButtons = document.querySelectorAll('.tab-btn');
    let currentGame = 'snake';

    function switchGame(gameId) {
      if (!panels[gameId]) return;
      // Hide all panels
      Object.values(panels).forEach(p => p.classList.remove('active-game'));
      panels[gameId].classList.add('active-game');
      
      tabButtons.forEach(btn => {
        const gameAttr = btn.getAttribute('data-game');
        if (gameAttr === gameId) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      
      currentGame = gameId;
      
      // Stop/reset specific intervals if needed (pong, snake loops are handled internally)
      if (gameId === 'pong') {
        if (window.pongAnimationId) cancelAnimationFrame(window.pongAnimationId);
        startPongGame(); 
      } else if (gameId === 'snake') {
        if (window.snakeInterval) clearInterval(window.snakeInterval);
        startSnakeGame();
      } else if (gameId === 'memory') {
        drawMemoryBoard();
      } else if (gameId === 'tictactoe') {
        drawTicTacToeBoard();
      }
    }

    tabButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const game = e.currentTarget.getAttribute('data-game');
        if (game) switchGame(game);
      });
    });

    // ---------- SNAKE GAME ----------
    const snakeCanvas = document.getElementById('snakeCanvas');
    const snakeCtx = snakeCanvas.getContext('2d');
    const snakeScoreSpan = document.getElementById('snakeScoreDisplay');
    
    let snake = [{x: 160, y: 160}];
    let food = {x: 200, y: 200};
    let direction = {x: 20, y: 0};
    let nextDirection = {x: 20, y: 0};
    let snakeScore = 0;
    let snakeGameOver = false;
    const gridSize = 20;
    const canvasSize = 320;

    function randomFood() {
      let newFood;
      while (true) {
        newFood = {
          x: Math.floor(Math.random() * (canvasSize / gridSize)) * gridSize,
          y: Math.floor(Math.random() * (canvasSize / gridSize)) * gridSize
        };
        if (!snake.some(seg => seg.x === newFood.x && seg.y === newFood.y)) break;
      }
      return newFood;
    }

    function drawSnake() {
      snakeCtx.clearRect(0, 0, canvasSize, canvasSize);
      // Draw food
      snakeCtx.fillStyle = '#ff6b6b';
      snakeCtx.beginPath();
      snakeCtx.arc(food.x + gridSize/2, food.y + gridSize/2, gridSize/2 - 2, 0, 2*Math.PI);
      snakeCtx.fill();
      // Draw snake
      snake.forEach((seg, idx) => {
        snakeCtx.fillStyle = idx === 0 ? '#7bed9f' : '#2ed573';
        snakeCtx.fillRect(seg.x + 2, seg.y + 2, gridSize - 4, gridSize - 4);
      });
      // Game over overlay
      if (snakeGameOver) {
        snakeCtx.fillStyle = 'rgba(0,0,0,0.7)';
        snakeCtx.fillRect(0, 0, canvasSize, canvasSize);
        snakeCtx.fillStyle = 'white';
        snakeCtx.font = 'bold 20px "Segoe UI"';
        snakeCtx.textAlign = 'center';
        snakeCtx.fillText('GAME OVER', canvasSize/2, canvasSize/2);
      }
    }

    function moveSnake() {
      if (snakeGameOver) return;
      direction = {...nextDirection};
      const head = snake[0];
      const newHead = {x: head.x + direction.x, y: head.y + direction.y};
      
      // Wall collision
      if (newHead.x < 0 || newHead.x >= canvasSize || newHead.y < 0 || newHead.y >= canvasSize) {
        snakeGameOver = true;
        drawSnake();
        return;
      }
      
      if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
        snakeGameOver = true;
        drawSnake();
        return;
      }
      
      snake.unshift(newHead);
      if (newHead.x === food.x && newHead.y === food.y) {
        snakeScore++;
        snakeScoreSpan.textContent = snakeScore;
        food = randomFood();
      } else {
        snake.pop();
      }
      drawSnake();
    }

    function startSnakeGame() {
      if (window.snakeInterval) clearInterval(window.snakeInterval);
      snake = [{x: 160, y: 160}];
      direction = {x: 20, y: 0};
      nextDirection = {x: 20, y: 0};
      snakeScore = 0;
      snakeGameOver = false;
      snakeScoreSpan.textContent = '0';
      food = randomFood();
      drawSnake();
      window.snakeInterval = setInterval(moveSnake, 130);
    }

    window.addEventListener('keydown', (e) => {
      if (currentGame !== 'snake') return;
      if (snakeGameOver) return;
      const key = e.key;
      e.preventDefault();
      if (key === 'ArrowUp' && direction.y === 0) nextDirection = {x: 0, y: -20};
      else if (key === 'ArrowDown' && direction.y === 0) nextDirection = {x: 0, y: 20};
      else if (key === 'ArrowLeft' && direction.x === 0) nextDirection = {x: -20, y: 0};
      else if (key === 'ArrowRight' && direction.x === 0) nextDirection = {x: 20, y: 0};
    });

    document.getElementById('snakeRestartBtn').addEventListener('click', startSnakeGame);

    // ---------- TIC TAC TOE ----------
    const tttCanvas = document.getElementById('tictactoeCanvas');
    const tttCtx = tttCanvas.getContext('2d');
    const tttStatus = document.getElementById('tttStatus');
    let board = Array(9).fill(null);
    let currentPlayer = 'X';
    let tttGameOver = false;

    function drawTicTacToeBoard() {
      tttCtx.clearRect(0, 0, 300, 300);
      tttCtx.strokeStyle = '#f0f3fa';
      tttCtx.lineWidth = 4;
      for (let i = 1; i < 3; i++) {
        tttCtx.beginPath();
        tttCtx.moveTo(i * 100, 0);
        tttCtx.lineTo(i * 100, 300);
        tttCtx.stroke();
        tttCtx.moveTo(0, i * 100);
        tttCtx.lineTo(300, i * 100);
        tttCtx.stroke();
      }
      tttCtx.font = 'bold 52px "Segoe UI"';
      tttCtx.textAlign = 'center';
      tttCtx.textBaseline = 'middle';
      for (let i = 0; i < 9; i++) {
        const x = (i % 3) * 100 + 50;
        const y = Math.floor(i / 3) * 100 + 50;
        if (board[i] === 'X') {
          tttCtx.fillStyle = '#f7b05e';
          tttCtx.fillText('X', x, y);
        } else if (board[i] === 'O') {
          tttCtx.fillStyle = '#74b9ff';
          tttCtx.fillText('O', x, y);
        }
      }
    }

    function checkTTTWinner() {
      const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      for (let [a,b,c] of lines) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a];
      }
      if (board.every(cell => cell !== null)) return 'draw';
      return null;
    }

    tttCanvas.addEventListener('click', (e) => {
      if (currentGame !== 'tictactoe' || tttGameOver) return;
      const rect = tttCanvas.getBoundingClientRect();
      const scaleX = tttCanvas.width / rect.width;
      const scaleY = tttCanvas.height / rect.height;
      const mouseX = (e.clientX - rect.left) * scaleX;
      const mouseY = (e.clientY - rect.top) * scaleY;
      const col = Math.floor(mouseX / 100);
      const row = Math.floor(mouseY / 100);
      const index = row * 3 + col;
      if (index >= 0 && index < 9 && !board[index]) {
        board[index] = currentPlayer;
        drawTicTacToeBoard();
        const winner = checkTTTWinner();
        if (winner) {
          tttGameOver = true;
          if (winner === 'draw') tttStatus.textContent = '🤝 Draw!';
          else tttStatus.textContent = `🏆 ${winner} wins!`;
        } else {
          currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
          tttStatus.textContent = `❌ Turn: ${currentPlayer}`;
        }
      }
    });

    function resetTTT() {
      board = Array(9).fill(null);
      currentPlayer = 'X';
      tttGameOver = false;
      tttStatus.textContent = '❌ Turn: X';
      drawTicTacToeBoard();
    }
    document.getElementById('tttRestartBtn').addEventListener('click', resetTTT);

    // ---------- PONG ----------
    const pongCanvas = document.getElementById('pongCanvas');
    const pongCtx = pongCanvas.getContext('2d');
    const pongScoreDisplay = document.getElementById('pongScoreDisplay');
    let pongBall, leftPaddle, rightPaddle, pongScore, pongKeys = {};
    
    function initPong() {
      pongBall = {x: 200, y: 125, vx: 3.5, vy: 2.2, radius: 7};
      leftPaddle = {x: 15, y: 100, w: 10, h: 60};
      rightPaddle = {x: 375, y: 100, w: 10, h: 60};
      pongScore = {left: 0, right: 0};
    }

    function drawPong() {
      pongCtx.clearRect(0, 0, 400, 250);
      pongCtx.fillStyle = '#f0f3fa';
      pongCtx.fillRect(leftPaddle.x, leftPaddle.y, leftPaddle.w, leftPaddle.h);
      pongCtx.fillRect(rightPaddle.x, rightPaddle.y, rightPaddle.w, rightPaddle.h);
      pongCtx.beginPath();
      pongCtx.arc(pongBall.x, pongBall.y, pongBall.radius, 0, 2*Math.PI);
      pongCtx.fillStyle = '#f7b05e';
      pongCtx.fill();
      pongScoreDisplay.textContent = `${pongScore.left} : ${pongScore.right}`;
    }

    function updatePong() {
      if (currentGame !== 'pong') return;
      pongBall.x += pongBall.vx;
      pongBall.y += pongBall.vy;
      if (pongBall.y - pongBall.radius <= 0 || pongBall.y + pongBall.radius >= 250) pongBall.vy *= -1;
      
      if (pongBall.x - pongBall.radius <= leftPaddle.x + leftPaddle.w && pongBall.y > leftPaddle.y && pongBall.y < leftPaddle.y + leftPaddle.h) {
        pongBall.vx *= -1.04;
        pongBall.x = leftPaddle.x + leftPaddle.w + pongBall.radius;
      }
      if (pongBall.x + pongBall.radius >= rightPaddle.x && pongBall.y > rightPaddle.y && pongBall.y < rightPaddle.y + rightPaddle.h) {
        pongBall.vx *= -1.04;
        pongBall.x = rightPaddle.x - pongBall.radius;
      }
      
      if (pongBall.x < 0) { pongScore.right++; resetBall(); }
      if (pongBall.x > 400) { pongScore.left++; resetBall(); }
      
      if (pongKeys['w'] && leftPaddle.y > 0) leftPaddle.y -= 6;
      if (pongKeys['s'] && leftPaddle.y < 190) leftPaddle.y += 6;
      if (pongKeys['ArrowUp'] && rightPaddle.y > 0) rightPaddle.y -= 6;
      if (pongKeys['ArrowDown'] && rightPaddle.y < 190) rightPaddle.y += 6;
      
      drawPong();
      window.pongAnimationId = requestAnimationFrame(updatePong);
    }

    function resetBall() {
      pongBall.x = 200; pongBall.y = 125;
      pongBall.vx = (Math.random() > 0.5 ? 3.5 : -3.5);
      pongBall.vy = (Math.random() * 4) - 2;
    }

    function startPongGame() {
      if (window.pongAnimationId) cancelAnimationFrame(window.pongAnimationId);
      initPong();
      drawPong();
      window.pongAnimationId = requestAnimationFrame(updatePong);
    }

    window.addEventListener('keydown', e => { pongKeys[e.key] = true; });
    window.addEventListener('keyup', e => { pongKeys[e.key] = false; });
    document.getElementById('pongRestartBtn').addEventListener('click', startPongGame);

    // ---------- MEMORY GAME ----------
    const memoryCanvas = document.getElementById('memoryCanvas');
    const memoryCtx = memoryCanvas.getContext('2d');
    const memoryMovesSpan = document.getElementById('memoryMoves');
    let memoryCards = [];
    let memoryFlipped = [];
    let memoryLocked = false;
    let memoryMoves = 0;
    const symbols = ['🍎','🍊','🍇','🍒','🍋','🍉','🥝','🍓'];
    
    function initMemory() {
      const pairs = [...symbols, ...symbols];
      memoryCards = pairs.sort(() => Math.random() - 0.5).map((sym, i) => ({symbol: sym, flipped: false, matched: false, index: i}));
      memoryFlipped = [];
      memoryMoves = 0;
      memoryMovesSpan.textContent = '0';
      memoryLocked = false;
      drawMemoryBoard();
    }

    function drawMemoryBoard() {
      memoryCtx.clearRect(0, 0, 320, 280);
      const cols = 4, rows = 4;
      const cardW = 60, cardH = 60, gap = 10;
      for (let i = 0; i < memoryCards.length; i++) {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const x = col * (cardW + gap) + 15;
        const y = row * (cardH + gap) + 10;
        const card = memoryCards[i];
        memoryCtx.fillStyle = card.matched ? '#2d5a27' : (card.flipped ? '#f5e6d3' : '#4a5060');
        memoryCtx.fillRect(x, y, cardW, cardH);
        memoryCtx.strokeStyle = '#fff';
        memoryCtx.lineWidth = 2;
        memoryCtx.strokeRect(x, y, cardW, cardH);
        if (card.flipped || card.matched) {
          memoryCtx.font = '32px "Segoe UI"';
          memoryCtx.fillStyle = '#1e1e2f';
          memoryCtx.textAlign = 'center';
          memoryCtx.fillText(card.symbol, x + cardW/2, y + cardH/2 + 10);
        }
      }
    }

    memoryCanvas.addEventListener('click', (e) => {
      if (currentGame !== 'memory' || memoryLocked) return;
      const rect = memoryCanvas.getBoundingClientRect();
      const scaleX = memoryCanvas.width / rect.width;
      const scaleY = memoryCanvas.height / rect.height;
      const mx = (e.clientX - rect.left) * scaleX;
      const my = (e.clientY - rect.top) * scaleY;
      const cols = 4, cardW = 60, cardH = 60, gap = 10;
      for (let i = 0; i < memoryCards.length; i++) {
        const col = i % cols, row = Math.floor(i / cols);
        const x = col * (cardW + gap) + 15;
        const y = row * (cardH + gap) + 10;
        if (mx >= x && mx <= x+cardW && my >= y && my <= y+cardH) {
          if (memoryCards[i].flipped || memoryCards[i].matched) return;
          memoryCards[i].flipped = true;
          memoryFlipped.push(i);
          if (memoryFlipped.length === 2) {
            memoryMoves++;
            memoryMovesSpan.textContent = memoryMoves;
            memoryLocked = true;
            const [idxA, idxB] = memoryFlipped;
            if (memoryCards[idxA].symbol === memoryCards[idxB].symbol) {
              memoryCards[idxA].matched = true;
              memoryCards[idxB].matched = true;
              memoryFlipped = [];
              memoryLocked = false;
              drawMemoryBoard();
            } else {
              setTimeout(() => {
                memoryCards[idxA].flipped = false;
                memoryCards[idxB].flipped = false;
                memoryFlipped = [];
                memoryLocked = false;
                drawMemoryBoard();
              }, 700);
            }
          }
          drawMemoryBoard();
          break;
        }
      }
    });
    document.getElementById('memoryRestartBtn').addEventListener('click', initMemory);

    // ---------- CLICKER GAME ----------
    const clickerCountSpan = document.getElementById('clickerCount');
    let clickerValue = 0;
    document.getElementById('clickerBtn').addEventListener('click', () => {
      if (currentGame !== 'clicker') return;
      clickerValue++;
      clickerCountSpan.textContent = clickerValue;
    });
    document.getElementById('clickerResetBtn').addEventListener('click', () => {
      clickerValue = 0;
      clickerCountSpan.textContent = '0';
    });

    // Initialize all games on page load
    function initialLoad() {
      startSnakeGame();
      resetTTT();
      startPongGame();
      initMemory();
      clickerValue = 0;
      clickerCountSpan.textContent = '0';
      switchGame('snake');
    }
    initialLoad();

    // Cleanup intervals when page unloads (optional)
    window.addEventListener('beforeunload', () => {
      if (window.snakeInterval) clearInterval(window.snakeInterval);
      if (window.pongAnimationId) cancelAnimationFrame(window.pongAnimationId);
    });
  })();
</script>
</body>
</html>
